  - key: JWT_PUBLIC_KEY_B64
    fromService:
      type: pserv
      name: camerahub-identity
      envVarKey: JWT_PUBLIC_KEY_B64
  - key: AI_ENABLED
    value: 'true'
  - key: OPENAI_API_KEY
    fromService:
      type: pserv
      name: camerahub-moderation
      envVarKey: OPENAI_API_KEY
databases:
- name: camerahub-identity-db
  databaseName: camerahub_identity
  user: camerahub_identity
  region: singapore
  plan: 0.1c-256mb
  diskSizeGB: 1
  postgresMajorVersion: '16'
  ipAllowList: []
- name: camerahub-marketplace-db
  databaseName: camerahub_marketplace
  user: camerahub_marketplace
  region: singapore
  plan: 0.1c-256mb
  diskSizeGB: 1
  postgresMajorVersion: '16'
  ipAllowList: []
- name: camerahub-moderation-db
  databaseName: camerahub_moderation
  user: camerahub_moderation
  region: singapore
  plan: 0.1c-256mb
  diskSizeGB: 1
  postgresMajorVersion: '16'
  ipAllowList: []
- name: camerahub-commerce-db
  databaseName: camerahub_commerce
  user: camerahub_commerce
  region: singapore
  plan: 0.1c-256mb
  diskSizeGB: 1
  postgresMajorVersion: '16'
  ipAllowList: []
- name: camerahub-advisor-db
  databaseName: camerahub_advisor
  user: camerahub_advisor
  region: singapore
  plan: 0.1c-256mb
  diskSizeGB: 1
  postgresMajorVersion: '16'
  ipAllowList: []
envVarGroups:
- name: camerahub-render
  envVars:
  - key: SERVICE_INTERNAL_KEY
    generateValue: true
  - key: PORT
    value: '10000'
  - key: SESSION_COOKIE_SECURE
    value: 'true'
