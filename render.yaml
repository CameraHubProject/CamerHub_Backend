# One Spring Boot backend; the existing frontend remains on Vercel and database on Neon.
# Update the existing CamerHub_Backend service in place when using the dashboard.
services:
  - type: web
    name: CamerHub_Backend
    runtime: docker
    repo: https://github.com/CameraHubProject/CamerHub_Backend
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: SERVICE_INTERNAL_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://camerahubweb.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      - key: GOOGLE_LOGIN_ENABLED
        value: 'false'
      - key: AI_ENABLED
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false
