# Paid deployment: approximately USD 81/month plus usage. Review docs/DEPLOY_RENDER.md before creating.
# Sources must be published to codex/render-deploy in both repositories first.
services:
- type: web
  name: camerahub-web
  runtime: docker
  repo: https://github.com/CameraHubProject/CameraHub_Frontend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  healthCheckPath: /healthz
  envVars:
  - key: PORT
    value: '10000'
  - key: GATEWAY_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-gateway
      property: hostport
- type: pserv
  name: camerahub-gateway
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: api-gateway
  - &id001
    key: IDENTITY_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-identity
      property: hostport
  - &id002
    key: MARKETPLACE_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-marketplace
      property: hostport
  - &id003
    key: MODERATION_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-moderation
      property: hostport
  - &id004
    key: COMMERCE_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-commerce
      property: hostport
  - &id005
    key: ADVISOR_HOSTPORT
    fromService:
      type: pserv
      name: camerahub-advisor
      property: hostport
- type: pserv
  name: camerahub-identity
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: identity-service
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - key: DB_HOST
    fromDatabase:
      name: camerahub-identity-db
      property: host
  - key: DB_PORT
    fromDatabase:
      name: camerahub-identity-db
      property: port
  - key: DB_NAME
    fromDatabase:
      name: camerahub-identity-db
      property: database
  - key: DB_USER
    fromDatabase:
      name: camerahub-identity-db
      property: user
  - key: DB_PASSWORD
    fromDatabase:
      name: camerahub-identity-db
      property: password
  - key: JWT_PUBLIC_KEY_B64
    sync: false
  - key: JWT_PRIVATE_KEY_B64
    sync: false
  - key: FRONTEND_URL
    fromService:
      type: web
      name: camerahub-web
      envVarKey: RENDER_EXTERNAL_URL
  - key: GOOGLE_LOGIN_ENABLED
    value: 'false'
- type: pserv
  name: camerahub-marketplace
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: marketplace-service
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - key: DB_HOST
    fromDatabase:
      name: camerahub-marketplace-db
      property: host
  - key: DB_PORT
    fromDatabase:
      name: camerahub-marketplace-db
      property: port
  - key: DB_NAME
    fromDatabase:
      name: camerahub-marketplace-db
      property: database
  - key: DB_USER
    fromDatabase:
      name: camerahub-marketplace-db
      property: user
  - key: DB_PASSWORD
    fromDatabase:
      name: camerahub-marketplace-db
      property: password
  - key: JWT_PUBLIC_KEY_B64
    fromService:
      type: pserv
      name: camerahub-identity
      envVarKey: JWT_PUBLIC_KEY_B64
  disk:
    name: product-media
    mountPath: /var/data/media
    sizeGB: 1
- type: pserv
  name: camerahub-moderation
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: moderation-service
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - key: DB_HOST
    fromDatabase:
      name: camerahub-moderation-db
      property: host
  - key: DB_PORT
    fromDatabase:
      name: camerahub-moderation-db
      property: port
  - key: DB_NAME
    fromDatabase:
      name: camerahub-moderation-db
      property: database
  - key: DB_USER
    fromDatabase:
      name: camerahub-moderation-db
      property: user
  - key: DB_PASSWORD
    fromDatabase:
      name: camerahub-moderation-db
      property: password
  - key: JWT_PUBLIC_KEY_B64
    fromService:
      type: pserv
      name: camerahub-identity
      envVarKey: JWT_PUBLIC_KEY_B64
  - key: CAMERAHUB_MODERATION_BOOTSTRAP_ON_START
    value: 'true'
  - key: AI_ENABLED
    value: 'true'
  - key: OPENAI_API_KEY
    sync: false
- type: pserv
  name: camerahub-commerce
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: commerce-service
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - key: DB_HOST
    fromDatabase:
      name: camerahub-commerce-db
      property: host
  - key: DB_PORT
    fromDatabase:
      name: camerahub-commerce-db
      property: port
  - key: DB_NAME
    fromDatabase:
      name: camerahub-commerce-db
      property: database
  - key: DB_USER
    fromDatabase:
      name: camerahub-commerce-db
      property: user
  - key: DB_PASSWORD
    fromDatabase:
      name: camerahub-commerce-db
      property: password
  - key: JWT_PUBLIC_KEY_B64
    fromService:
      type: pserv
      name: camerahub-identity
      envVarKey: JWT_PUBLIC_KEY_B64
- type: pserv
  name: camerahub-advisor
  runtime: docker
  repo: https://github.com/CameraHubProject/CamerHub_Backend
  branch: codex/render-deploy
  region: singapore
  plan: 0.5c-512mb
  dockerfilePath: ./deploy/render/Dockerfile
  dockerContext: .
  autoDeployTrigger: 'off'
  envVars:
  - fromGroup: camerahub-render
  - key: SERVICE
    value: ai-advisor-service
  - *id001
  - *id002
  - *id003
