spring.application.name=camerahub
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=camerahub
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.hibernate.orm.connections.pooling=ERROR
camerahub.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
camerahub.google.client-id=${GOOGLE_CLIENT_ID:}
camerahub.google.client-secret=${GOOGLE_CLIENT_SECRET:}
camerahub.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:5173/api/auth/google/callback}
camerahub.frontend-url=${FRONTEND_URL:http://127.0.0.1:5173}
