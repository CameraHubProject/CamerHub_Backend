spring.application.name=identity-service
camerahub.security.mode=identity
server.port=${IDENTITY_SERVICE_PORT:8081}
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
camerahub.internal.key=${SERVICE_INTERNAL_KEY}
camerahub.services.identity=${IDENTITY_URL:http://127.0.0.1:8081}
camerahub.services.marketplace=${MARKETPLACE_URL:http://127.0.0.1:8082}
camerahub.services.moderation=${MODERATION_URL:http://127.0.0.1:8083}
camerahub.services.commerce=${COMMERCE_URL:http://127.0.0.1:8084}
camerahub.services.advisor=${ADVISOR_URL:http://127.0.0.1:8085}
spring.datasource.url=${IDENTITY_SERVICE_DB_URL}
spring.datasource.username=${IDENTITY_SERVICE_DB_USER}
spring.datasource.password=${IDENTITY_SERVICE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
camerahub.events.enabled=${SERVICE_EVENTS_ENABLED:true}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=camerahub.SPRING_SESSION
server.servlet.session.cookie.name=CAMERAHUB_SESSION
camerahub.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
camerahub.google.client-id=${GOOGLE_CLIENT_ID:}
camerahub.google.client-secret=${GOOGLE_CLIENT_SECRET:}
camerahub.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:5173/api/auth/google/callback}
camerahub.frontend-url=${FRONTEND_URL:http://127.0.0.1:5173}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
camerahub.jwt.public-key=${JWT_PUBLIC_KEY_PATH:.local/jwt/public.pem}
camerahub.jwt.issuer=${JWT_ISSUER:camerahub-identity}
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
camerahub.jwt.private-key=${JWT_PRIVATE_KEY_PATH:.local/jwt/private.pem}
